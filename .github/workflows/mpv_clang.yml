name: mpv clang
defaults:
  run:
    shell: bash

# PT fork (pt-filters): manual runs only; x86_64 libmpv (mpv-dev) only; artifacts only, no release.
# Same tag 20260811 sources: mpv ad59ff1 (pinned upstream) + every branch-tracking dependency
# reset to its state at the upstream release run start (2026-08-11T10:20:11Z, run 31481746942).
# Run "llvm toolchain" on this branch first (it fills the clang_root / toolchain caches).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIN_DATE: "2026-08-11T10:20:11Z"

jobs:
  build_mpv:
    name: Building mpv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bit: [x86_64]
    env:
      BIT: ${{ matrix.bit }}
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Init variable
        run: |
          echo "arch=x86_64" >> $GITHUB_ENV

      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory '*'

      - uses: actions/checkout@main

      - name: Installing Meson
        run: |
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --upgrade --break-system-packages 'meson>=1.3.0'
          meson --version

      - name: Loading clang sysroot cache
        id: load_clang_cache
        uses: actions/cache/restore@main
        with:
          path: |
            clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_VERSION }}-clang_root
          fail-on-cache-miss: true

      - name: Loading ${{ matrix.bit }} toolchain cache
        uses: actions/cache/restore@main
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ secrets.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain
          fail-on-cache-miss: true

      - name: Configuring CMake & Downloading source
        run: |
          cmake -DTARGET_ARCH=${{ env.arch }}-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_$BIT/$BIT-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -G Ninja --fresh -B build_$BIT -S $PWD
          find build_$BIT/packages -path "*/src/*-stamp/*-download" -delete || true
          ninja -C build_$BIT download

      - name: Building mpv
        run: |
          ninja -C build_$BIT update
          bash .github/pt/pin_sources.sh $PWD/src_packages "$PIN_DATE" mpv
          # ANGLE removed the D3D9 EGL enums on 2026-07-06 (c1f9769be2c2); mpv ad59ff1 still uses them and the
          # upstream 20260811 build had older ANGLE headers (stale cached checkout) -> use the commit before that removal.
          git -C src_packages/angle-headers reset --hard -q 0cb8023c01f92b29f3738ea7472d06f8f059ed84
          echo "PIN fixed  angle-headers $(git -C src_packages/angle-headers rev-parse --short=12 HEAD)"
          ninja -C build_$BIT mpv

      - name: Packaging mpv
        run: |
          mkdir -p release_$BIT
          ninja -C build_$BIT mpv-packaging
          shopt -s nullglob
          artifacts=(build_$BIT/mpv*.7z build_$BIT/mpv*.zip)
          if ((${#artifacts[@]} == 0)); then
            echo "No mpv archives were produced."
            exit 1
          fi
          mv "${artifacts[@]}" release_$BIT
          ls -la release_$BIT

      - name: Source revisions used
        if: always()
        run: |
          for d in src_packages/*/; do [[ -d "$d/.git" ]] && echo "$(basename $d) $(git -C $d rev-parse --short=12 HEAD) $(git -C $d log -1 --format=%cI HEAD)"; done || true

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p build_${BIT}_logs
          cp -fr $(find build_$BIT -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") build_${BIT}_logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z build*logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: mpv-${{ matrix.bit }}-logs
          path: logs.7z
          retention-days: 3

      - name: Uploading ${{ matrix.bit }} dev (libmpv)
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}-dev
          path: release_${{ matrix.bit }}/mpv-dev-${{ env.arch }}*
          retention-days: 7
